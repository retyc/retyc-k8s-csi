# PrivateBin (https://github.com/PrivateBin/docker-nginx-fpm-alpine), two replicas sharing one RWX
# claim. Its Filesystem storage keeps one small file per paste plus a server salt and the traffic
# limiter state under /srv/data, no database: a paste created through one replica is readable
# through the other. Apply and browse the ingress controller's address (k3s ships Traefik): the
# rule has no host, so it catches every request.
apiVersion: v1
kind: Namespace
metadata:
  name: privatebin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: privatebin-data
  namespace: privatebin
  labels:
    app: privatebin
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retyc-rwx
  resources:
    requests:
      storage: 1Gi
---
# PrivateBin purges expired pastes while it handles a paste creation, at most every [purge] limit
# seconds: it reads every paste to find the expired ones, one WebDAV round trip each, which stalls
# that request for seconds on a cold cache. The CronJob at the end purges instead. A limit below 1
# does not disable the purge but runs it on every creation (PurgeLimiter::canPurge): ten years it
# is. Absent or empty sections keep PrivateBin's defaults.
apiVersion: v1
kind: ConfigMap
metadata:
  name: privatebin-config
  namespace: privatebin
  labels:
    app: privatebin
data:
  conf.php: |
    ;<?php http_response_code(403); /*
    [main]

    [model]
    class = Filesystem

    [model_options]

    [purge]
    limit = 315360000
    batchsize = 10
    ;*/
---
# Headless service governing the StatefulSet's pod identities.
apiVersion: v1
kind: Service
metadata:
  name: privatebin-headless
  namespace: privatebin
  labels:
    app: privatebin
spec:
  clusterIP: None
  ports:
    - port: 8080
      name: http
  selector:
    app: privatebin
---
apiVersion: v1
kind: Service
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    app: privatebin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  serviceName: privatebin-headless
  replicas: 2
  # Replicas are interchangeable, no need to start them one after the other.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: privatebin
  template:
    metadata:
      labels:
        app: privatebin
    spec:
      automountServiceAccountToken: false
      # No fsGroup: the driver declares fsGroupPolicy None, the davfs2 mount is world-writable
      # (dir_mode=0777, file_mode=0666) and rejects chown anyway.
      securityContext:
        runAsUser: 65534
        runAsGroup: 82
      containers:
        - name: privatebin
          image: ghcr.io/privatebin/fs:2.0.6
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /srv/data
              # Lets the pod see the volume again when the node plugin restarts (doc/architecture.md).
              mountPropagation: HostToContainer
            # The only other writable paths with a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: nginx-tmp
              mountPath: /var/lib/nginx/tmp
            - name: config
              mountPath: /srv/cfg
              readOnly: true
      # Every replica mounts the same claim: no volumeClaimTemplates on purpose.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: privatebin-data
        - name: tmp
          emptyDir:
            medium: Memory
        - name: run
          emptyDir:
            medium: Memory
        - name: nginx-tmp
          emptyDir: {}
        - name: config
          configMap:
            name: privatebin-config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privatebin
  namespace: privatebin
  labels:
    app: privatebin
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privatebin
                port:
                  name: http
---
# Purges the expired pastes outside of user requests (see the ConfigMap).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: privatebin-purge
  namespace: privatebin
  labels:
    app: privatebin
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: privatebin-purge
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65534
            runAsGroup: 82
          containers:
            - name: purge
              image: ghcr.io/privatebin/fs:2.0.6
              # The script raises PHP 8.5 deprecation notices (upstream, harmless): kept out of the logs.
              command: ["php", "-d", "error_reporting=E_ALL & ~E_DEPRECATED", "/srv/bin/administration", "--purge"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: data
                  mountPath: /srv/data
                - name: config
                  mountPath: /srv/cfg
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: privatebin-data
            - name: config
              configMap:
                name: privatebin-config
            - name: tmp
              emptyDir:
                medium: Memory
