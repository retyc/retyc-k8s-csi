# Dataroom versioning through a VolumeAttributesClass (Kubernetes 1.34+): the driver applies its
# `versioning` parameter at creation and whenever the claim switches classes
# (ControllerModifyVolume, `retyc dataroom set --versioning`). With versioning, every `close` of a
# written file keeps a version. Turning it off is destructive: the versions are dropped.
apiVersion: storage.k8s.io/v1
kind: VolumeAttributesClass
metadata:
  name: retyc-versioned
driverName: csi.retyc.com
parameters:
  versioning: "true"
---
apiVersion: storage.k8s.io/v1
kind: VolumeAttributesClass
metadata:
  name: retyc-unversioned
driverName: csi.retyc.com
parameters:
  versioning: "false"
---
# Created with versioning. `kubectl patch pvc retyc-versioned-data -p
# '{"spec":{"volumeAttributesClassName":"retyc-unversioned"}}'` turns it off.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retyc-versioned-data
  annotations:
    csi.retyc.com/uid: "1000"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retyc-rwx
  volumeAttributesClassName: retyc-versioned
  resources:
    requests:
      storage: 20Gi
