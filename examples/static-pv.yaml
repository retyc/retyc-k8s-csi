# Re-adopt an existing dataroom (e.g. one left behind by a retyc-rwx-retain PVC, or created by
# hand) as a static PV. The node plugin only needs the dataroom *title* to build the WebDAV
# path; the ID is the CSI volume handle. Both come from `retyc --json dataroom ls`.
#
# Static PVs are never deleted by the provisioner (no provisioned-by annotation), so
# reclaimPolicy: Retain is the honest value here — Delete would leave a Released PV with a
# dataroom nobody removes.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: retyc-adopted
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: retyc-rwx-retain
  csi:
    driver: csi.retyc.com
    volumeHandle: REPLACE-WITH-DATAROOM-ID        # e.g. 01a06bd5-45b6-7489-bc18-04990d98b0c2
    volumeAttributes:
      title: REPLACE-WITH-DATAROOM-TITLE          # e.g. pvc-cf063793-b879-489d-95ab-7b9f14d0f082
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retyc-adopted
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retyc-rwx-retain
  volumeName: retyc-adopted      # pin to the PV above instead of provisioning a new dataroom
  resources:
    requests:
      storage: 1Gi
