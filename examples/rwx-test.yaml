# End-to-end smoke test: one RWX claim, a writer pod appending a line every 5s, a reader pod
# tailing the same file. See doc/testing.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retyc-rwx-test
  annotations:
    # Every file of the volume belongs to UID 1000 (GID too, by default): only a pod running as
    # 1000 can write. Mandatory on a Retyc claim.
    csi.retyc.com/uid: "1000"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retyc-rwx
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: retyc-writer
spec:
  securityContext:
    runAsUser: 1000 # the claim's csi.retyc.com/uid: the only UID allowed to write
    runAsGroup: 1000
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
          # Lets the pod see the volume again when the node plugin restarts (doc/architecture.md).
          mountPropagation: HostToContainer
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: retyc-rwx-test
---
apiVersion: v1
kind: Pod
metadata:
  name: retyc-reader
spec:
  securityContext:
    runAsUser: 2000 # another UID on purpose: it reads, but gets "Permission denied" on a write
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"--- $(date)\"; tail -n 3 /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
          # Lets the pod see the volume again when the node plugin restarts (doc/architecture.md).
          mountPropagation: HostToContainer
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: retyc-rwx-test
