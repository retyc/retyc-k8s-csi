name: _Docker

on:
  workflow_call:
    inputs:
      tags:
        description: "Newline-separated list of image tags"
        required: true
        type: string
      version:
        description: "Version string for the VERSION build-arg and the OCI labels"
        required: true
        type: string
      push:
        description: "Push the image; false only builds it (branches, pull requests)"
        required: false
        type: boolean
        default: true

jobs:
  docker:
    name: ${{ inputs.push && 'Push image' || 'Build image' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only for the final stage's apt-get on the foreign platform (a cached layer most of the
      # time): the Go build cross-compiles from the build platform.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build date
        id: date
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Needed to push, and kept on build-only runs for the retyc-cli base image: it is public
      # on ghcr.io, but logging in keeps the build working should the package ever go private,
      # and lifts any anonymous rate limit.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push only: the secrets are not available to a pull request from a fork.
      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          provenance: ${{ inputs.push && 'mode=max,version=v1' || 'false' }}
          sbom: ${{ inputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ inputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.date.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
