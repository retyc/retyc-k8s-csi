name: Chart

# Publishes charts/retyc-csi whenever its Chart.yaml version changes on master: a GitHub release
# per chart version, the index.yaml of the Helm repository on the gh-pages branch (served at
# https://retyc.github.io/retyc-k8s-csi), and the same package on the OCI registry.
on:
  push:
    branches: [master]
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'
  workflow_dispatch:

jobs:
  release:
    name: Release chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Lint
        run: helm lint charts/retyc-csi

      # Packages charts whose version has no release yet, creates the release with the .tgz,
      # and regenerates index.yaml on gh-pages. Chart releases are not marked "latest" so the
      # driver's own v* releases keep that spot.
      - name: chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          mark_as_latest: false
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log in to GitHub Container Registry
        if: steps.cr.outputs.changed_charts != ''
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Check remote version before bump chart 
      - name: Push to OCI registry
        if: steps.cr.outputs.changed_charts != ''
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            meta=$(helm show chart "$pkg")
            # Anchored on ^ so nested "name:"/"version:" keys (maintainers, dependencies) cannot
            # win, and without yq, whose implementations disagree on quoting scalars.
            name=$(echo "$meta" | awk -F': *' '/^name:/ { gsub(/"/, "", $2); print $2; exit }')
            version=$(echo "$meta" | awk -F': *' '/^version:/ { gsub(/"/, "", $2); print $2; exit }')
            if helm show chart "oci://ghcr.io/retyc/charts/$name" --version "$version" >/dev/null 2>&1; then
              echo "oci://ghcr.io/retyc/charts/$name:$version already published, skipping"
              continue
            fi
            helm push "$pkg" oci://ghcr.io/retyc/charts
          done
