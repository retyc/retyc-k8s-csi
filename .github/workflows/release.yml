name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_ci.yml

  docker:
    name: Docker
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_docker.yml
    with:
      tags: |
        ghcr.io/retyc/retyc-k8s-csi:${{ github.ref_name }}
        ghcr.io/retyc/retyc-k8s-csi:latest
        retyc/retyc-k8s-csi:${{ github.ref_name }}
        retyc/retyc-k8s-csi:latest
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    name: GitHub release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # The driver's release: image tags and generated notes. The chart is released separately,
      # by the Chart workflow, when charts/retyc-csi/Chart.yaml is bumped to reference this tag.
      # A release created from the GitHub UI creates the tag (and this run) itself: nothing to
      # do then, the run only has to publish the image.
      - name: GitHub release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists, keeping it"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
