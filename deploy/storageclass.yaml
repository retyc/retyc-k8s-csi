# No per-dataroom capacity enforcement on the backend — requested PVC sizes are
# accepted best-effort and not actually limited.
#
# No CSI secret parameters on the first two classes: they use the cluster-wide identity injected
# into the controller/node pods' environment via deploy/secret.yaml.example (envFrom). The third
# class resolves a Secret in the claim's namespace instead.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: retyc-rwx
provisioner: csi.retyc.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
# Same thing, but deleting the PVC keeps the dataroom: the PV goes to Released and the
# external-provisioner never calls DeleteVolume for a Retain PV. The Retyc data outlives the
# cluster object; delete the dataroom yourself (`retyc dataroom rm`) or re-adopt it with a
# static PV (deploy/examples/static-pv.yaml).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: retyc-rwx-retain
provisioner: csi.retyc.com
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
# Per-tenant identities: every namespace using this class must hold a Secret named
# `retyc-credentials` (keys RETYC_TOKEN and RETYC_KEY_PASSPHRASE). external-provisioner resolves
# it for CreateVolume/DeleteVolume, kubelet for NodeStageVolume; the driver pods' own Secret is
# not involved. Retain is the safe default here: if a tenant deletes its Secret before its
# claims, a Delete policy would leave the PV stuck with a DeleteVolume that can no longer
# authenticate.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: retyc-rwx-tenant
provisioner: csi.retyc.com
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: retyc-credentials
  csi.storage.k8s.io/provisioner-secret-namespace: ${pvc.namespace}
  csi.storage.k8s.io/node-stage-secret-name: retyc-credentials
  csi.storage.k8s.io/node-stage-secret-namespace: ${pvc.namespace}
