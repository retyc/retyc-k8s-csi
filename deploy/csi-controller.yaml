apiVersion: apps/v1
kind: Deployment
metadata:
  name: retyc-csi-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retyc-csi-controller
  template:
    metadata:
      labels:
        app: retyc-csi-controller
    spec:
      serviceAccountName: retyc-csi-controller
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
          # No --leader-election: single replica, and it would need coordination.k8s.io/leases RBAC.
          args:
            - "--csi-address=/csi/csi.sock"
            - "--extra-create-metadata"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: retyc-csi-controller
          image: retyc/retyc-k8s-csi:dev
          args:
            - "--mode=controller"
            - "--endpoint=unix:///csi/csi.sock"
            - "--http-endpoint=:9808"
          ports:
            - name: health
              containerPort: 9808
          # /readyz runs `retyc auth status` (cached 2 min): the pod goes NotReady (reason on
          # /readyz and in the logs) when the Secret's token is missing, expired or revoked. Being
          # a Deployment, a rollout with bad credentials never replaces the last working pod.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          # Every CreateVolume/DeleteVolume is a short-lived `retyc` subprocess; same scrypt
          # caveat as the node plugin if it ever has to unlock the key.
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 512Mi}
          envFrom:
            - secretRef:
                name: retyc-csi-credentials
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
