# End-to-end smoke test: one RWX claim, a writer pod appending a line every 5s, a reader pod
# tailing the same file. See doc/testing.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retyc-rwx-test
spec:
  accessModes: [ReadWriteMany]
  storageClassName: retyc-rwx
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: retyc-writer
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: retyc-rwx-test
---
apiVersion: v1
kind: Pod
metadata:
  name: retyc-reader
spec:
  securityContext:
    runAsUser: 1000 # non-root on purpose: exercises the dir_mode/file_mode mount options
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"--- $(date)\"; tail -n 3 /data/log.txt; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: retyc-rwx-test
