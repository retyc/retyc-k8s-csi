# Privileged: the node plugin needs to run `mount -t davfs` / bind-mount and have that mount
# become visible to kubelet on the host (mountPropagation: Bidirectional) — the same requirement
# every filesystem CSI node plugin (csi-driver-nfs, csi-driver-smb, ...) has. /dev/fuse is needed
# for davfs2 itself. The supervised `retyc webdav serve` and `mount.davfs` both run
# inside this same container/netns, so no hostNetwork is required.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: retyc-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: retyc-csi-node
  template:
    metadata:
      labels:
        app: retyc-csi-node
    spec:
      serviceAccountName: retyc-csi-node
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/csi.retyc.com/csi.sock"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: retyc-csi-node
          image: retyc/retyc-k8s-csi:dev
          args:
            - "--mode=node"
            - "--endpoint=unix:///csi/csi.sock"
            - "--http-endpoint=:9808"
          ports:
            - name: health
              containerPort: 9808
          # Liveness is deliberately lax: a restart of this container kills every davfs2 mount
          # on the node (the FUSE daemons live here), so only a driver that stopped serving HTTP
          # altogether should trip it. /readyz carries the real diagnosis (supervised
          # `retyc webdav serve` answering on loopback, with its last output when it isn't) and
          # only flips the pod to NotReady; the reason is on /readyz and in this container's logs
          # (kubelet's event carries the 503 alone).
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          # The steady state is ~40 MiB, but resolving a dataroom session runs an age scrypt
          # (2^18 work factor: ~256 MiB of working memory, once per dataroom per process) inside
          # `retyc webdav serve`. A limit below ~350 MiB OOM-kills the plugin on the first mount
          # — and with it every mount on the node.
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 512Mi}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: retyc-csi-credentials
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: plugin-dir
              mountPath: /var/lib/kubelet/plugins
              mountPropagation: Bidirectional
            - name: dev-fuse
              mountPath: /dev/fuse
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.retyc.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins
            type: Directory
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
