# Privileged: the node plugin runs `mount -t davfs` and bind mounts that must become visible to
# kubelet (mountPropagation: Bidirectional), like every filesystem CSI node plugin. /dev/fuse is
# for davfs2. The supervised `retyc webdav serve` and `mount.davfs` share this container's network
# namespace, so no hostNetwork is needed.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "retyc-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "retyc-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  updateStrategy:
    {{- toYaml .Values.node.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "retyc-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
        {{- with .Values.node.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if and .Values.credentials.create (not .Values.credentials.existingSecret) .Values.credentials.token }}
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.node.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "retyc-csi.node.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: node-driver-registrar
          image: "{{ .Values.node.registrar.image.repository }}:{{ .Values.node.registrar.image.tag }}"
          imagePullPolicy: {{ .Values.node.registrar.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.node.kubeletDir }}/plugins/{{ include "retyc-csi.driverName" . }}/csi.sock
          resources:
            {{- toYaml .Values.node.registrar.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: retyc-csi-node
          image: {{ include "retyc-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --http-endpoint=:{{ .Values.healthPort }}
            - --webdav-port={{ .Values.node.webdavPort }}
            - --state-dir={{ .Values.node.stateDir }}
            - -v={{ .Values.logLevel }}
            {{- range .Values.node.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.node.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "retyc-csi.credentialsEnvFrom" . | nindent 10 }}
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: {{ .Values.node.kubeletDir }}/pods
              mountPropagation: Bidirectional
            - name: plugin-dir
              mountPath: {{ .Values.node.kubeletDir }}/plugins
              mountPropagation: Bidirectional
            - name: dev-fuse
              mountPath: /dev/fuse
            {{- with .Values.node.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins/{{ include "retyc-csi.driverName" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/pods
            type: Directory
        - name: plugin-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins
            type: Directory
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        {{- with .Values.node.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
