{{- if .Values.rbac.create }}
# Standard external-provisioner permissions. The node plugin needs none beyond kubelet's socket.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retyc-csi.fullname" . }}-provisioner
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  {{- if eq (include "retyc-csi.usesTenantSecrets" .) "true" }}
  # StorageClasses with a tenantSecretName make the provisioner read the claim namespace's Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  {{- end }}
  {{- if has "--leader-election" .Values.controller.provisioner.extraArgs }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retyc-csi.fullname" . }}-provisioner
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retyc-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retyc-csi.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
{{- end }}
