{{- if .Values.rbac.create }}
# Standard external-provisioner permissions, plus the driver's own `get` on the claims it provisions
# (their annotations), already covered by the persistentvolumeclaims rule. The node plugin's are at
# the end.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retyc-csi.fullname" . }}-provisioner
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  {{- if eq (include "retyc-csi.usesTenantSecrets" .) "true" }}
  # StorageClasses with a tenantSecretName make the provisioner read the claim namespace's Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retyc-csi.fullname" . }}-provisioner
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retyc-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retyc-csi.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# Standard external-resizer permissions (expansion and VolumeAttributesClass changes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retyc-csi.fullname" . }}-resizer
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  # --handle-volume-inuse-error (on by default) watches the pods using a claim.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  {{- if eq (include "retyc-csi.usesTenantSecrets" .) "true" }}
  # StorageClasses with a tenantSecretName make the resizer read the claim namespace's Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retyc-csi.fullname" . }}-resizer
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retyc-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retyc-csi.fullname" . }}-resizer
  apiGroup: rbac.authorization.k8s.io
{{- if eq (include "retyc-csi.leaderElection" .) "true" }}
---
# Leader election of csi-provisioner and csi-resizer (more than one controller replica): their
# leases live in the driver's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "retyc-csi.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "retyc-csi.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retyc-csi.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "retyc-csi.fullname" . }}-leader-election
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# Node plugin: reads the claims it stages (their annotations) and records events on them. Before
# mounting a volume with the driver's own identity (no node-stage secrets), it reads its PV (by name
# from the claim, else by listing them for the volume handle) and the PV's StorageClass: a tenant
# class is refused.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "retyc-csi.fullname" . }}-node
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retyc-csi.fullname" . }}-node
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retyc-csi.node.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "retyc-csi.fullname" . }}-node
  apiGroup: rbac.authorization.k8s.io
---
# Node plugin, in the driver's namespace only: the mount pods and their Secrets (copies of the
# identities they mount with).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "retyc-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "retyc-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "retyc-csi.node.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "retyc-csi.fullname" . }}-node
  apiGroup: rbac.authorization.k8s.io
{{- end }}
