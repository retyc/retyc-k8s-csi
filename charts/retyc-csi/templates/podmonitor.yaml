{{- /*
Prometheus Operator scrapes: both driver components on their HTTP port, and the mount pods (created
by the node plugin, not by Helm) on the CLI's metrics port.
*/ -}}
{{- if .Values.metrics.podMonitor.enabled }}
{{- $pm := .Values.metrics.podMonitor }}
{{- $endpoint := dict }}
{{- with $pm.interval }}{{ $_ := set $endpoint "interval" . }}{{ end }}
{{- with $pm.scrapeTimeout }}{{ $_ := set $endpoint "scrapeTimeout" . }}{{ end }}
{{- with $pm.relabelings }}{{ $_ := set $endpoint "relabelings" . }}{{ end }}
{{- with $pm.metricRelabelings }}{{ $_ := set $endpoint "metricRelabelings" . }}{{ end }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "retyc-csi.fullname" . }}
  namespace: {{ $pm.namespace | default .Release.Namespace }}
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
    {{- with $pm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "retyc-csi.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - {{ merge (dict "port" "health" "path" "/metrics") $endpoint | toYaml | indent 6 | trim }}
---
# The mount pods: retycfs_*, the Go runtime and the process, one target
# per volume and node (labels csi.retyc.com/volume, /node, /pvc, /namespace on the pod).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "retyc-csi.fullname" . }}-mount
  namespace: {{ $pm.namespace | default .Release.Namespace }}
  labels:
    {{- include "retyc-csi.labels" . | nindent 4 }}
    {{- with $pm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: retyc-mount
      app.kubernetes.io/managed-by: retyc-k8s-csi
  podMetricsEndpoints:
    - {{ merge (dict "port" "metrics" "path" "/metrics") $endpoint | toYaml | indent 6 | trim }}
{{- end }}
