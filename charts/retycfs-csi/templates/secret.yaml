{{- if and .Values.credentials.create (not .Values.credentials.existingSecret) .Values.credentials.token }}
{{- if not .Values.credentials.keyPassphrase }}
{{- fail "credentials.keyPassphrase is required when credentials.token is set" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "retycfs-csi.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  RETYC_TOKEN: {{ .Values.credentials.token | quote }}
  RETYC_KEY_PASSPHRASE: {{ .Values.credentials.keyPassphrase | quote }}
{{- end }}
