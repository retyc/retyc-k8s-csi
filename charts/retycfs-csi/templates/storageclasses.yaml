{{- /* A class without tenantSecretName needs the cluster-wide identity: skipped without one (NOTES). */ -}}
{{- $global := include "retycfs-csi.credentialsSecretName" . }}
{{- range .Values.storageClasses }}
{{- if or .tenantSecretName $global }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "retycfs-csi.labels" $ | nindent 4 }}
  annotations:
    {{- if .isDefault }}
    storageclass.kubernetes.io/is-default-class: "true"
    {{- end }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
provisioner: {{ include "retycfs-csi.driverName" $ }}
reclaimPolicy: {{ .reclaimPolicy | default "Delete" }}
allowVolumeExpansion: true
volumeBindingMode: {{ .volumeBindingMode | default "Immediate" }}
{{- if .tenantSecretName }}
parameters:
  csi.storage.k8s.io/provisioner-secret-name: {{ .tenantSecretName | quote }}
  csi.storage.k8s.io/provisioner-secret-namespace: ${pvc.namespace}
  csi.storage.k8s.io/node-stage-secret-name: {{ .tenantSecretName | quote }}
  csi.storage.k8s.io/node-stage-secret-namespace: ${pvc.namespace}
  # csi-resizer: ControllerExpandVolume, and ControllerModifyVolume which reuses this secret.
  csi.storage.k8s.io/controller-expand-secret-name: {{ .tenantSecretName | quote }}
  csi.storage.k8s.io/controller-expand-secret-namespace: ${pvc.namespace}
{{- end }}
{{- end }}
{{- end }}
