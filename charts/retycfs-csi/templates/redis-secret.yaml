{{- /*
Redis credentials for cache.store: redis. With the subchart: its password (auth.existingSecret of
the subchart points here) and the URL built from it. With an external Redis given as a URL: the URL.
The node plugin reads RETYC_CACHE_REDIS_URL from it, never from the mount-config ConfigMap. None with
cache.redis.subchart.existingSecret: that Secret holds both.
*/ -}}
{{- $c := .Values.cache }}
{{- $subchart := and $c.redis.subchart.enabled (not $c.redis.subchart.existingSecret) }}
{{- if and (eq $c.store "redis") (or $subchart (and (not $c.redis.subchart.enabled) $c.redis.external.url (not $c.redis.external.existingSecret))) }}
{{- $name := include "retycfs-csi.redisAuthSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
type: Opaque
{{- if $c.redis.subchart.enabled }}
{{- /* Explicit password, else the one already stored (upgrades), else a new one. */}}
{{- $password := $c.redis.subchart.password }}
{{- if not $password }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $password = index .data "redis-password" | default "" | b64dec }}
{{- end }}
{{- end }}
{{- $password = $password | default (randAlphaNum 32) }}
stringData:
  redis-password: {{ $password | quote }}
  RETYC_CACHE_REDIS_URL: {{ printf "redis://default:%s@%s:%v" $password (include "retycfs-csi.redisSubchartHost" .) (dig "service" "port" 6379 (.Values.redis | default dict)) | quote }}
{{- else }}
stringData:
  RETYC_CACHE_REDIS_URL: {{ $c.redis.external.url | quote }}
{{- end }}
{{- end }}
