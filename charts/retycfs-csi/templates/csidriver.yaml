# Without a CSIDriver object kubelet assumes attachRequired=true and waits for a VolumeAttachment
# that no external-attacher will ever create: this is a NAS-like driver with no ControllerPublish.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ include "retycfs-csi.driverName" . }}
  labels:
    {{- include "retycfs-csi.labels" . | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: false
  # kubelet must not chown/chmod the volume for a pod's fsGroup: RetycFS reports every file as
  # owned by the claim's csi.retycfs.com/uid and gid (`retyc fs mount --uid/--gid`), so a recursive
  # chown would change nothing and walk the whole dataroom through the API. A pod writes by running
  # as that UID, not through fsGroup.
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Persistent
